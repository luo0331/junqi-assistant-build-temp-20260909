name: build-unsigned-ipa
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Normalize Xcode project format
        run: sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' JunqiAssistant.xcodeproj/project.pbxproj
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project JunqiAssistant.xcodeproj \
            -scheme JunqiAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JunqiAssistant.app Payload/
          zip -qr JunqiAssistant-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JunqiAssistant-unsigned-ipa
          path: JunqiAssistant-unsigned.ipa




