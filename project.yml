name: JunqiAssistant
options:
  bundleIdPrefix: com.junqi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
targets:
  JunqiAssistant:
    type: application
    platform: iOS
    sources:
      - path: JunqiAssistant
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junqi.assistant
        PRODUCT_NAME: JunqiAssistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: JunqiAssistant/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: JunqiBroadcast
        embed: true
  JunqiBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junqi.assistant.broadcast
        PRODUCT_NAME: JunqiBroadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        SKIP_INSTALL: YES
schemes:
  JunqiAssistant:
    build:
      targets:
        JunqiAssistant: all
        JunqiBroadcast: all
    run:
      config: Debug
    archive:
      config: Release




